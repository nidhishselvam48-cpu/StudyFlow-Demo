<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>StudyFlow - Student Task Manager</title>
  <style>:root {
  --bg: #f4f6fb; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
  --primary: #3b5bdb; --primary-dark: #2f49b3; --border: #e5e7eb;
  --high: #dc2626; --medium: #d97706; --low: #059669; --done: #9ca3af; --hover: #f3f4f6;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
[hidden] { display: none !important; }
h1, h2 { margin: 0; }
h2 { font-size: 1.05rem; margin-bottom: 14px; }
.muted { color: var(--muted); }
.center { text-align: center; }
.error { color: var(--high); min-height: 1.2em; margin: 8px 0 0; font-size: .9rem; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: .92rem; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-dark); }

label { display: flex; flex-direction: column; gap: 5px; font-size: .85rem; color: var(--muted); }
input, select { padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: .95rem; background: var(--card); color: var(--text); }
input:focus, select:focus { outline: 2px solid rgba(59,91,219,.3); border-color: var(--primary); }

.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.auth-card { width: 100%; max-width: 400px; }
.auth-card h1 { color: var(--primary); }
.auth-card form { display: grid; gap: 14px; }
.tabs { display: flex; gap: 6px; margin: 18px 0; }
.tab { flex: 1; padding: 9px; border: 0; border-bottom: 2px solid var(--border); background: none; cursor: pointer; color: var(--muted); font-size: .95rem; }
.tab.active { color: var(--primary); border-color: var(--primary); font-weight: 600; }

.topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--border); }
.topbar h1 { color: var(--primary); font-size: 1.3rem; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.container { max-width: 900px; margin: 22px auto; padding: 0 16px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.stat b { display: block; font-size: 1.7rem; }
.stat span { color: var(--muted); font-size: .85rem; }
.stat.warn b { color: var(--high); }

.task-form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.span-2 { grid-column: span 2; }
.form-actions { grid-column: 1 / -1; display: flex; gap: 10px; }

.filters { display: grid; grid-template-columns: 1fr 160px 160px; gap: 10px; margin-bottom: 14px; }
.task-list { list-style: none; margin: 0; padding: 0; }
.task { display: flex; gap: 12px; align-items: flex-start; padding: 13px 4px; border-bottom: 1px solid var(--border); }
.task:last-child { border-bottom: 0; }
.task input[type=checkbox] { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--primary); }
.task-main { flex: 1; min-width: 0; }
.task-title { font-weight: 600; word-break: break-word; }
.task.done .task-title { text-decoration: line-through; color: var(--done); }
.task-desc { color: var(--muted); font-size: .88rem; margin-top: 2px; word-break: break-word; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; font-size: .78rem; }
.badge { padding: 2px 9px; border-radius: 999px; background: #eef2ff; color: var(--primary); }
.badge.high { background: #fee2e2; color: var(--high); }
.badge.medium { background: #fef3c7; color: var(--medium); }
.badge.low { background: #d1fae5; color: var(--low); }
.badge.overdue { background: var(--high); color: #fff; }
.task-actions { display: flex; gap: 6px; }
.icon-btn { border: 1px solid var(--border); background: var(--card); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: .8rem; }
.icon-btn:hover { background: var(--hover); }
.icon-btn.danger { color: var(--high); }

@media (max-width: 640px) {
  .task-form { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
  .filters { grid-template-columns: 1fr; }
  .task { flex-wrap: wrap; }
}

:root { color-scheme: light dark; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#111827; --card:#1f2937; --text:#f3f4f6; --muted:#9ca3af; --border:#374151; --hover:#374151; }
  .badge { background:#312e81; color:#c7d2fe; } .badge.high{background:#7f1d1d;color:#fecaca} .badge.medium{background:#78350f;color:#fde68a} .badge.low{background:#064e3b;color:#a7f3d0}
}
.demo-note { background:#fef3c7; color:#78350f; text-align:center; font-size:.8rem; padding:6px 10px; }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>
  <div class="demo-note">Demo preview: your data is saved only in this browser. The full app uses a Node.js server and SQLite.</div>
  <!-- Authentication view -->
  <main id="auth-view" class="auth-wrap" hidden>
    <section class="card auth-card">
      <h1>StudyFlow</h1>
      <p class="muted">Plan your assignments, records and exams in one place.</p>
      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Login</button>
        <button id="tab-register" class="tab" type="button">Register</button>
      </div>
      <form id="auth-form" novalidate>
        <label id="name-field" hidden>Name
          <input id="name" type="text" autocomplete="name" placeholder="Your full name" />
        </label>
        <label>Email
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </label>
        <label>Password
          <input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters" required />
        </label>
        <p id="auth-error" class="error" role="alert"></p>
        <button id="auth-submit" class="btn primary" type="submit">Login</button>
      </form>
    </section>
  </main>

  <!-- Dashboard view -->
  <div id="app-view" hidden>
    <header class="topbar">
      <h1>StudyFlow</h1>
      <div class="topbar-right">
        <span id="user-name" class="muted"></span>
        <button id="logout" class="btn" type="button">Logout</button>
      </div>
    </header>

    <main class="container">
      <section class="stats" id="stats"></section>

      <section class="card">
        <h2 id="form-title">Add a task</h2>
        <form id="task-form" class="task-form" novalidate>
          <label class="span-2">Title
            <input id="t-title" type="text" maxlength="120" placeholder="e.g. Complete DBMS record" required />
          </label>
          <label>Subject
            <input id="t-subject" type="text" maxlength="60" placeholder="e.g. DBMS" />
          </label>
          <label>Priority
            <select id="t-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
          <label>Due date
            <input id="t-due" type="date" />
          </label>
          <label class="span-2">Notes
            <input id="t-desc" type="text" maxlength="1000" placeholder="Optional details" />
          </label>
          <div class="form-actions">
            <button id="t-submit" class="btn primary" type="submit">Add task</button>
            <button id="t-cancel" class="btn" type="button" hidden>Cancel</button>
          </div>
        </form>
        <p id="form-error" class="error" role="alert"></p>
      </section>

      <section class="card">
        <div class="filters">
          <input id="f-q" type="search" placeholder="Search title or subject" />
          <select id="f-status">
            <option value="">All status</option>
            <option value="pending">Pending</option>
            <option value="done">Done</option>
          </select>
          <select id="f-priority">
            <option value="">All priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <ul id="task-list" class="task-list"></ul>
        <p id="empty" class="muted center" hidden>No tasks found. Add your first task above.</p>
      </section>
    </main>
  </div>

  <script>(() => {
  const $ = (sel) => document.querySelector(sel);

  let token = localStorage.getItem('sf_token');
  let user = JSON.parse(localStorage.getItem('sf_user') || 'null');
  let mode = 'login';        // 'login' | 'register'
  let editingId = null;      // id of the task being edited, or null when adding
  let tasks = [];

  // ---------- helpers ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };


  // ---------- in-browser demo backend (replaces the Express + SQLite server) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let mem = {};
  const load = (k, d) => (k in mem ? mem[k] : (mem[k] = store.get(k, d)));
  const save = (k, v) => { mem[k] = v; store.set(k, v); };
  const iso = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const fail = (m) => { throw new Error(m); };

  async function api(path, { method = 'GET', body } = {}) {
    const url = new URL(path, 'http://x'); const p = url.pathname; const q = url.searchParams;
    const users = load('sf_demo_users', []);
    if (p === '/auth/register' && method === 'POST') {
      const name = String(body.name || '').trim(), email = String(body.email || '').trim().toLowerCase();
      if (!name) fail('Name is required');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) fail('A valid email is required');
      if (String(body.password || '').length < 6) fail('Password must be at least 6 characters');
      if (users.find((u) => u.email === email)) fail('Email is already registered');
      const u = { id: users.length + 1, name, email, password: body.password };
      save('sf_demo_users', [...users, u]);
      const seed = [['Complete DBMS record','DBMS','high',-2,'Normalization and SQL query exercises'],['Prepare Computer Networks presentation','CN','high',2,'OSI model, topologies and protocols'],['Submit lab record','Professional Skills','medium',5,''],['Revise JavaScript promises','Web Development','low',9,'']];
      const all = load('sf_demo_tasks', []);
      seed.forEach(([title, subject, priority, d, description], i) => all.push({ id: Date.now() + i, user_id: u.id, title, subject, priority, status: 'pending', due_date: iso(d), description }));
      save('sf_demo_tasks', all);
      return { token: 'demo-' + u.id, user: { id: u.id, name, email } };
    }
    if (p === '/auth/login' && method === 'POST') {
      const u = users.find((x) => x.email === String(body.email || '').trim().toLowerCase() && x.password === body.password);
      if (!u) fail('Incorrect email or password');
      return { token: 'demo-' + u.id, user: { id: u.id, name: u.name, email: u.email } };
    }
    if (!token) fail('Authentication required');
    const uid = Number(token.replace('demo-', ''));
    let all = load('sf_demo_tasks', []);
    const mine = () => all.filter((t) => t.user_id === uid);
    if (p === '/tasks/stats/summary') {
      const m = mine(), pend = m.filter((t) => t.status === 'pending');
      return { total: m.length, done: m.length - pend.length, pending: pend.length, overdue: pend.filter((t) => t.due_date && t.due_date < iso(0)).length, high_priority: pend.filter((t) => t.priority === 'high').length };
    }
    if (p === '/tasks' && method === 'GET') {
      let m = mine();
      if (q.get('status')) m = m.filter((t) => t.status === q.get('status'));
      if (q.get('priority')) m = m.filter((t) => t.priority === q.get('priority'));
      if (q.get('q')) m = m.filter((t) => (t.title + ' ' + t.subject).toLowerCase().includes(q.get('q').toLowerCase()));
      return m.sort((a, b) => (a.status === 'done') - (b.status === 'done') || (a.due_date ? 0 : 1) - (b.due_date ? 0 : 1) || String(a.due_date).localeCompare(String(b.due_date)) || b.id - a.id);
    }
    const check = (b) => { if (!String(b.title || '').trim()) fail('Title is required'); };
    if (p === '/tasks' && method === 'POST') {
      check(body);
      const t = { id: Date.now(), user_id: uid, title: body.title.trim(), subject: (body.subject || '').trim(), priority: body.priority || 'medium', status: 'pending', due_date: body.due_date || null, description: (body.description || '').trim() };
      save('sf_demo_tasks', [...all, t]); return t;
    }
    const m = p.match(/^\/tasks\/(\d+)(\/toggle)?$/);
    if (m) {
      const t = all.find((x) => x.id === Number(m[1]) && x.user_id === uid);
      if (!t) fail('Task not found');
      if (method === 'DELETE') { save('sf_demo_tasks', all.filter((x) => x !== t)); return null; }
      if (m[2]) t.status = t.status === 'done' ? 'pending' : 'done';
      else { check(body); Object.assign(t, { title: body.title.trim(), subject: (body.subject || '').trim(), priority: body.priority, due_date: body.due_date || null, description: (body.description || '').trim() }); }
      save('sf_demo_tasks', all); return t;
    }
    fail('Endpoint not found');
  }

  // ---------- auth ----------
  function showView() {
    $('#auth-view').hidden = !!token;
    $('#app-view').hidden = !token;
    if (token) {
      $('#user-name').textContent = user ? user.name : '';
      refresh();
    }
  }

  function setMode(next) {
    mode = next;
    $('#tab-login').classList.toggle('active', mode === 'login');
    $('#tab-register').classList.toggle('active', mode === 'register');
    $('#name-field').hidden = mode !== 'register';
    $('#auth-submit').textContent = mode === 'login' ? 'Login' : 'Create account';
    $('#password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
    $('#auth-error').textContent = '';
  }

  function logout() {
    token = null; user = null;
    localStorage.removeItem('sf_token');
    localStorage.removeItem('sf_user');
    showView();
  }

  $('#tab-login').addEventListener('click', () => setMode('login'));
  $('#tab-register').addEventListener('click', () => setMode('register'));
  $('#logout').addEventListener('click', logout);

  $('#auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('#auth-error').textContent = '';
    try {
      const payload = { email: $('#email').value, password: $('#password').value };
      if (mode === 'register') payload.name = $('#name').value;
      const data = await api(`/auth/${mode}`, { method: 'POST', body: payload });
      token = data.token; user = data.user;
      localStorage.setItem('sf_token', token);
      localStorage.setItem('sf_user', JSON.stringify(user));
      $('#auth-form').reset();
      showView();
    } catch (err) {
      $('#auth-error').textContent = err.message;
    }
  });

  // ---------- tasks ----------
  async function refresh() {
    const params = new URLSearchParams();
    if ($('#f-q').value.trim()) params.set('q', $('#f-q').value.trim());
    if ($('#f-status').value) params.set('status', $('#f-status').value);
    if ($('#f-priority').value) params.set('priority', $('#f-priority').value);
    try {
      const [list, stats] = await Promise.all([api('/tasks?' + params), api('/tasks/stats/summary')]);
      tasks = list;
      renderStats(stats);
      renderTasks();
    } catch (err) {
      if (token) $('#form-error').textContent = err.message;
    }
  }

  function renderStats(s) {
    const items = [
      ['Total tasks', s.total, ''], ['Pending', s.pending, ''], ['Completed', s.done, ''],
      ['Overdue', s.overdue, s.overdue ? 'warn' : ''], ['High priority', s.high_priority, ''],
    ];
    $('#stats').innerHTML = items.map(([label, n, cls]) => `<div class="stat ${cls}"><b>${n}</b><span>${label}</span></div>`).join('');
  }

  function renderTasks() {
    $('#empty').hidden = tasks.length > 0;
    $('#task-list').innerHTML = tasks.map((t) => {
      const overdue = t.status === 'pending' && t.due_date && t.due_date < today();
      return `
        <li class="task ${t.status}" data-id="${t.id}">
          <input type="checkbox" ${t.status === 'done' ? 'checked' : ''} aria-label="Mark complete" />
          <div class="task-main">
            <div class="task-title">${esc(t.title)}</div>
            ${t.description ? `<div class="task-desc">${esc(t.description)}</div>` : ''}
            <div class="meta">
              <span class="badge ${t.priority}">${t.priority}</span>
              ${t.subject ? `<span class="badge">${esc(t.subject)}</span>` : ''}
              ${t.due_date ? `<span class="muted">Due ${esc(t.due_date)}</span>` : ''}
              ${overdue ? '<span class="badge overdue">Overdue</span>' : ''}
            </div>
          </div>
          <div class="task-actions">
            <button class="icon-btn" data-act="edit" type="button">Edit</button>
            <button class="icon-btn danger" data-act="delete" type="button">Delete</button>
          </div>
        </li>`;
    }).join('');
  }

  function resetForm() {
    editingId = null;
    $('#task-form').reset();
    $('#form-title').textContent = 'Add a task';
    $('#t-submit').textContent = 'Add task';
    $('#t-cancel').hidden = true;
    $('#form-error').textContent = '';
  }

  $('#task-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('#form-error').textContent = '';
    const body = {
      title: $('#t-title').value,
      subject: $('#t-subject').value,
      priority: $('#t-priority').value,
      due_date: $('#t-due').value || null,
      description: $('#t-desc').value,
    };
    try {
      if (editingId) await api(`/tasks/${editingId}`, { method: 'PUT', body });
      else await api('/tasks', { method: 'POST', body });
      resetForm();
      refresh();
    } catch (err) {
      $('#form-error').textContent = err.message;
    }
  });

  $('#t-cancel').addEventListener('click', resetForm);

  $('#task-list').addEventListener('click', async (e) => {
    const li = e.target.closest('.task');
    if (!li) return;
    const id = li.dataset.id;
    const act = e.target.dataset.act;
    try {
      if (e.target.type === 'checkbox') {
        await api(`/tasks/${id}/toggle`, { method: 'PATCH' });
        refresh();
      } else if (act === 'delete') {
        if ((() => { try { return confirm('Delete this task?'); } catch { return true; } })()) { await api(`/tasks/${id}`, { method: 'DELETE' }); refresh(); }
      } else if (act === 'edit') {
        const t = tasks.find((x) => String(x.id) === id);
        editingId = t.id;
        $('#t-title').value = t.title;
        $('#t-subject').value = t.subject;
        $('#t-priority').value = t.priority;
        $('#t-due').value = t.due_date || '';
        $('#t-desc').value = t.description;
        $('#form-title').textContent = 'Edit task';
        $('#t-submit').textContent = 'Update task';
        $('#t-cancel').hidden = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    } catch (err) {
      $('#form-error').textContent = err.message;
    }
  });

  let timer;
  $('#f-q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(refresh, 250); });
  $('#f-status').addEventListener('change', refresh);
  $('#f-priority').addEventListener('change', refresh);

  setMode('login');
  showView();
})();
</script>
</body>
</html>
